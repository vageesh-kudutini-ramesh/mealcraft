# Production configuration (Render + Neon)
# All sensitive values come from environment variables set in Render dashboard

# Server port (Render sets PORT env var)
server.port=${PORT:8080}

# Database - Neon (set these env vars in Render)
spring.datasource.url=${DATABASE_URL}
spring.datasource.username=${DATABASE_USERNAME}
spring.datasource.password=${DATABASE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA - production settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# JWT (set JWT_SECRET in Render)
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:864000000}

# CORS - allow Vercel frontend (set CORS_ALLOWED_ORIGINS in Render, e.g. https://mealcraft.vercel.app)
cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Spoonacular API (set SPOONACULAR_API_KEY in Render)
spoonacular.api.key=${SPOONACULAR_API_KEY}
spoonacular.api.base-url=https://api.spoonacular.com

# Logging
logging.level.com.mealcraft=INFO
logging.level.org.springframework.security=WARN
