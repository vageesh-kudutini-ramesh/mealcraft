# Application Configuration
spring.application.name=mealcraft-backend
server.port=8080

# Load local overrides (create from application-local.properties.example; never commit)
spring.config.additional-location=optional:file:./application-local.properties

# Database Configuration (PostgreSQL)
# Override spring.datasource.password in application-local.properties
spring.datasource.url=jdbc:postgresql://localhost:5432/mealcraft_db
spring.datasource.username=postgres
spring.datasource.password=
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# JWT Configuration - override jwt.secret in application-local.properties
jwt.secret=
jwt.expiration=864000000

# CORS Configuration (for frontend communication)
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# Spoonacular API - override spoonacular.api.key in application-local.properties
# Get your free key at https://spoonacular.com/food-api/console
spoonacular.api.key=
spoonacular.api.base-url=https://api.spoonacular.com

# Logging Configuration
logging.level.com.mealcraft=DEBUG
logging.level.org.springframework.security=DEBUG



